spec_version: 1
name: security
description: >-
  shipcrew security engineer (verify role): static security review plus live attack of the running app; writes only PoC/regression tests and .shipcrew/security.md, never fixes app code (findings become a fix task).

# Code-writing / tool-heavy role: the real Claude Code CLI (claude-native), so
# the human can open its terminal from the board and take over, with only its
# bundle's skills and MCP servers (no host-user plugins, hooks or settings). No model is pinned:
# it runs on the configured Claude provider (a Claude subscription works).
executor:
  type: omnigent
  config:
    harness: claude-native
    # One gate, no bypassPermissions: the guardrails below decide every shell
    # command (allowlisted -> runs with no prompt, anything else -> an ASK
    # approval card in the Inbox) and every write (owned paths). Claude's own
    # `default` mode would prompt a second time, so the tools the policies
    # govern are pre-approved with --allowedTools; any other tool still gets
    # Claude's prompt, which omnigent routes to the Inbox too.
    permission_mode: default
    allowed_tools: Bash,Edit,Write,MultiEdit,NotebookEdit,Read,Glob,Grep,LS,TodoWrite,Task,Agent,Skill,BashOutput,KillShell,WebSearch,WebFetch,mcp__omnigent,mcp__chrome-devtools
    # >>> shipcrew-mcp: chrome-devtools
    # GENERATED from agents/_shared/mcp/*.json by scripts/build_agents.py.
    # Only these MCP servers (plus omnigent's relay), never the host user's own.
    strict_mcp_config: true
    # No host-user settings (~/.claude/settings.json: their plugins, hooks,
    # user skills); the bundle's own skills still load (--plugin-dir).
    setting_sources: project,local
    mcp_config: '{"mcpServers":{"chrome-devtools":{"command":"npx","args":["-y","chrome-devtools-mcp@latest","--headless","--isolated","--executablePath","${CHROMIUM_PATH:-/usr/bin/chromium}"]}}}'
    # <<< shipcrew-mcp

# ROLE.md + _shared/COMMON.md, rendered by scripts/build_agents.py.
instructions: AGENTS.md

# The session cwd is the task's git worktree (created by the shipcrew
# orchestrator). Unsandboxed like omnigent's polly workers; the policy layer
# below enforces the shipcrew limits.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

# >>> shipcrew-guardrails: blast_radius no_remote_writes no_env_read workflows_approval no_browser_download shell_allowlist_security owned_paths_security test_writes_security
# GENERATED from agents/_shared/policies/*.yaml by scripts/build_agents.py.
guardrails:
  ask_timeout: 86400
  policies:
    # Polly's catastrophic DENY set: force-push, rm -rf of / or a system dir,
    # hard reset to a remote ref. Everything recoverable runs without an ASK
    # (headless workers cannot answer one), the push ban is shipcrew_no_remote_writes.
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.orchestration.blast_radius
        arguments:
          gate_pushes: false
    # Workers never publish: the shipcrew orchestrator pushes and runs the PR loop.
    shipcrew_no_remote_writes:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          reason: Workers may not push or open/merge PRs; the shipcrew orchestrator does that. Commit locally and finish.
          expression: |
            event.type == "tool_call"
            && event.data.name in ["sys_os_shell", "Bash", "bash", "Shell", "terminal", "developer__shell", "shell"]
            && has(event.data.arguments.command)
            && (
              event.data.arguments.command.matches(r'(^|[^A-Za-z0-9_.-])git(\s+(-C|-c|--git-dir|--work-tree|--namespace)\s+\S+|\s+-\S+)*\s+push\b')
              || event.data.arguments.command.matches(r'(^|[^A-Za-z0-9_.-])gh\s+(pr\s+(create|merge|close|reopen|ready)|release\s+create|repo\s+(create|delete|fork))\b')
              || event.data.arguments.command.matches(r'(^|[^A-Za-z0-9_.-])gh\s+api\b.*(-X|--method)(\s+|=)?(POST|PUT|PATCH|DELETE)\b')
            )
            ? {"result": "DENY"}
            : {"result": "ALLOW"}
    # Secrets stay out of the model context. .env.example / .sample / .template are fine.
    # `vercel env pull` is the one allowed command naming a .env file (it writes it).
    shipcrew_no_env_read:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          reason: Reading .env* secret files is not allowed. Refer to variables by name only.
          expression: |
            event.type == "tool_call"
            && (
              (
                event.data.name in ["Read", "Grep", "sys_os_read", "read", "grep"]
                && (
                  (has(event.data.arguments.file_path)
                    && event.data.arguments.file_path.matches(r'(^|/)\.env(\.[^/]*)?$')
                    && !event.data.arguments.file_path.matches(r'(^|/)\.env\.(example|sample|template|dist)$'))
                  || (has(event.data.arguments.path)
                    && event.data.arguments.path.matches(r'(^|/)\.env(\.[^/]*)?$')
                    && !event.data.arguments.path.matches(r'(^|/)\.env\.(example|sample|template|dist)$'))
                )
              )
              || (
                event.data.name in ["sys_os_shell", "Bash", "bash", "Shell", "terminal", "developer__shell", "shell"]
                && has(event.data.arguments.command)
                && event.data.arguments.command.matches(r'(^|[\s\x22\x27=<>/:])\.env(\.(local|development|production|test|preview|staging|prod|dev))*($|[\s\x22\x27;|&)>])')
                && !event.data.arguments.command.matches(r'^\s*(npx\s+)?vercel\s+env\s+pull\b[^;&|]*$')
              )
            )
            ? {"result": "DENY"}
            : {"result": "ALLOW"}
    # CI definitions are the merge gate: changing them needs a human (approval card
    # in the Inbox). Any write to .github/workflows/** asks: write tools, and shell
    # write targets (redirections, cp/mv/tee, sed -i, git checkout <path> ...) or a
    # command naming a workflow path that is not a known reader (yq -i, git diff
    # --output, scripts). Reads pass, also inside a chain with other commands
    # (`git checkout x -- a.js && ls .github/workflows` no longer asks); a command
    # naming workflows that cannot be analyzed ($(..), backticks, heredocs) asks.
    shipcrew_workflows_approval:
      type: function
      on: [tool_call]
      function:
        path: omnigent.shipcrew.policies.workflows_guard
        arguments:
          reason: Editing .github/workflows/** needs human approval.
    # A browser is preinstalled at $CHROMIUM_PATH; browser downloads are never needed.
    shipcrew_no_browser_download:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          reason: Never download browsers. Use the preinstalled one at $CHROMIUM_PATH (launchOptions.executablePath).
          expression: |
            event.type == "tool_call"
            && event.data.name in ["sys_os_shell", "Bash", "bash", "Shell", "terminal", "developer__shell", "shell"]
            && has(event.data.arguments.command)
            && event.data.arguments.command.matches(r'(\bplaywright(@\S+)?\s+install(-deps)?\b|@puppeteer/browsers\s+install\b|\bpuppeteer\s+browsers\s+install\b)')
            ? {"result": "DENY"}
            : {"result": "ALLOW"}
    # Security shell allowlist (a verify role, like qa): read, test, run the app,
    # curl to localhost only, plus file operations and `git add` / `git commit` for
    # the PoC / regression tests it writes. Every write target is judged by
    # shipcrew_test_writes_only (tests + .shipcrew/security.md only) and
    # shipcrew_owned_paths. No other git writes. Anything else asks.
    shipcrew_shell_allowlist:
      type: function
      on: [tool_call]
      function:
        path: omnigent.shipcrew.policies.shell_allowlist
        arguments:
          role: security
          shell_writes: true
          reason: A human approves or denies it on the approval card.
          # Commands a $VAR / ${VAR} expansion may appear in (the expansion-safe
          # entries: no !banned option, no glob word; see policies.shell_allowlist).
          read_only:
            # Read-only shell: listing, reading, searching, text processing. `!glob` words
            # refuse an argument (find -exec/-delete, sed -i or a `w` command, sort -o ...).
            - "ls"
            - "cat"
            - "head"
            - "tail"
            - "wc"
            - "rg !--pre*"  # --pre runs a preprocessor command
            - "grep"
            - "egrep"
            - "fgrep"
            - "find !-delete !-exec !-execdir !-ok !-okdir !-fprint* !-fls !-fprintf"
            # sed only with print scripts (`sed -n 5,40p f`, `sed -n '/re/p' f`): a sed
            # script can write files (w) or run commands (e), so nothing else passes.
            - 're:^sed -n (-[Er] )?(\d+(,(\d+|\$))?p|\$p|/[^/]*/(,/[^/]*/)?p)( [^ ]+)*$'
            - "jq"
            - "yq !-i* !--inplace*"
            - "tree !-o"
            - "sort !-o* !--output*"
            - "uniq"  # `uniq IN OUT` writes OUT: judged as a write
            - "cut"
            - "tr"
            - "diff"
            - "cmp"
            - "comm"
            - "column"
            - "nl"
            - "file"
            - "stat"
            - "du"
            - "df"
            - "pwd"
            - "cd"
            - "echo"
            - "printf !-v*"  # printf -v sets a shell variable
            - "which"
            - "type"
            - "basename"
            - "dirname"
            - "realpath"
            - "readlink"
            - "date"
            - "sleep"
            - "wait"  # for a job started with a trailing `&`
            - "true"
            - "false"
            - "test"
            - "["
            - "uname"
            - "whoami"
            - 're:^python3? -m json\.tool( -[-\w]+)*( \S+)?$'
            - 're:^[\w.@/-]+ (--version|-v|-V)$'
            # GitHub reads (the board never calls real GitHub; a fake gh is fine too).
            - "gh pr view"
            - "gh pr list"
            - "gh pr diff"
            - "gh pr checks"
            - "gh pr status"
            - "gh run view"
            - "gh run list"
            - "gh issue view"
            - "gh issue list"
            - "gh repo view"
            - "gh auth status"
            # git inspection. No remote writes, no config changes.
            - "git status"
            - "git diff !--output*"
            - "git log !--output*"
            - "git show !--output*"
            - "git rev-parse"
            - "git rev-list !--output*"
            - "git ls-files"
            - "git ls-tree"
            - "git cat-file"
            - "git blame"
            - "git grep !-O* !--open-files-in-pager*"
            - "git merge-base"
            - "git describe"
            - "git shortlog !--output*"
            - "git name-rev"
            - "git for-each-ref"
            - "git show-ref"
            - "git diff-tree !--output*"
            - "git check-ignore"
            - "git worktree list"
            - "git stash list"
            - "git stash show"
            - "git reflog $"
            - "git reflog show"
            - "git remote $"
            - "git remote -v $"
            - "git tag $"
            - "git tag -l"
            - "git tag --list"
            - "git branch $"
            - "git branch --show-current"
            - "git branch --list"
            - "git branch -a $"
            - "git branch -r $"
            - "git branch -v $"
            - "git branch -vv $"
            - "git branch --contains"
            - "git branch --merged"
            - "git config --get"
            - "git config --get-all"
          allow:
            # Read-only shell: listing, reading, searching, text processing. `!glob` words
            # refuse an argument (find -exec/-delete, sed -i or a `w` command, sort -o ...).
            - "ls"
            - "cat"
            - "head"
            - "tail"
            - "wc"
            - "rg !--pre*"  # --pre runs a preprocessor command
            - "grep"
            - "egrep"
            - "fgrep"
            - "find !-delete !-exec !-execdir !-ok !-okdir !-fprint* !-fls !-fprintf"
            # sed only with print scripts (`sed -n 5,40p f`, `sed -n '/re/p' f`): a sed
            # script can write files (w) or run commands (e), so nothing else passes.
            - 're:^sed -n (-[Er] )?(\d+(,(\d+|\$))?p|\$p|/[^/]*/(,/[^/]*/)?p)( [^ ]+)*$'
            - "jq"
            - "yq !-i* !--inplace*"
            - "tree !-o"
            - "sort !-o* !--output*"
            - "uniq"  # `uniq IN OUT` writes OUT: judged as a write
            - "cut"
            - "tr"
            - "diff"
            - "cmp"
            - "comm"
            - "column"
            - "nl"
            - "file"
            - "stat"
            - "du"
            - "df"
            - "pwd"
            - "cd"
            - "echo"
            - "printf !-v*"  # printf -v sets a shell variable
            - "which"
            - "type"
            - "basename"
            - "dirname"
            - "realpath"
            - "readlink"
            - "date"
            - "sleep"
            - "wait"  # for a job started with a trailing `&`
            - "true"
            - "false"
            - "test"
            - "["
            - "uname"
            - "whoami"
            - 're:^python3? -m json\.tool( -[-\w]+)*( \S+)?$'
            - 're:^[\w.@/-]+ (--version|-v|-V)$'
            # GitHub reads (the board never calls real GitHub; a fake gh is fine too).
            - "gh pr view"
            - "gh pr list"
            - "gh pr diff"
            - "gh pr checks"
            - "gh pr status"
            - "gh run view"
            - "gh run list"
            - "gh issue view"
            - "gh issue list"
            - "gh repo view"
            - "gh auth status"
            # git inspection. No remote writes, no config changes.
            - "git status"
            - "git diff !--output*"
            - "git log !--output*"
            - "git show !--output*"
            - "git rev-parse"
            - "git rev-list !--output*"
            - "git ls-files"
            - "git ls-tree"
            - "git cat-file"
            - "git blame"
            - "git grep !-O* !--open-files-in-pager*"
            - "git merge-base"
            - "git describe"
            - "git shortlog !--output*"
            - "git name-rev"
            - "git for-each-ref"
            - "git show-ref"
            - "git diff-tree !--output*"
            - "git check-ignore"
            - "git worktree list"
            - "git stash list"
            - "git stash show"
            - "git reflog $"
            - "git reflog show"
            - "git remote $"
            - "git remote -v $"
            - "git tag $"
            - "git tag -l"
            - "git tag --list"
            - "git branch $"
            - "git branch --show-current"
            - "git branch --list"
            - "git branch -a $"
            - "git branch -r $"
            - "git branch -v $"
            - "git branch -vv $"
            - "git branch --contains"
            - "git branch --merged"
            - "git config --get"
            - "git config --get-all"
            # Commit on the task branch only (verify roles commit the tests they wrote).
            # No branch/checkout/reset/merge: those rewrite files or history.
            - "git add"
            - "git commit"
            # File operations; shipcrew_owned_paths decides whether each target is allowed.
            - "mkdir"
            - "touch"
            - "cp"
            - "mv"
            - "rm"
            - "rmdir"
            - "chmod"
            - "tee"
            # Package managers (install from the lockfile only), test runners, linters,
            # typecheckers and builds. Adding or removing a dependency is not here: it
            # changes package.json + the lockfile (shared contract files) and asks.
            - "npm test"
            - "npm t"
            - "npm run $"
            - "npm run *"
            - "npm run-script *"
            - "npm ci"
            - "npm ls"
            - "npm view"
            - "npm audit !fix"
            - "pnpm test"
            - "pnpm run *"
            - "pnpm install --frozen-lockfile"
            - "pnpm i --frozen-lockfile"
            - "pnpm lint"
            - "pnpm build"
            - "pnpm typecheck"
            - "pnpm type-check"
            - "pnpm e2e"
            - "pnpm test:*"
            - "pnpm e2e:*"
            - "npm run e2e"
            - "pnpm ls"
            - "pnpm audit !--fix"
            - "yarn test"
            - "yarn run *"
            - "yarn install --frozen-lockfile"
            - "yarn install --immutable"
            - "yarn lint"
            - "yarn build"
            - "yarn typecheck"
            - "yarn e2e"
            - "node --test"
            - "npx vitest"
            - "vitest"
            - "npx jest"
            - "jest"
            - "npx playwright test"
            - "playwright test"
            - "npx tsc"
            - "tsc"
            - "npx eslint"
            - "eslint"
            - "npx prettier"
            - "prettier"
            - "npx next build"
            - "next build"
            - "npx next lint"
            - "next lint"
            - "npx biome"
            - "biome"
            - "npx stylelint"
            - "npx @google/design.md lint"
            - "pytest"
            - "python -m pytest"
            - "python3 -m pytest"
            - ".venv/bin/pytest"
            - ".venv/bin/python -m pytest"
            - "uv run pytest"
            - "uv run python -m pytest"
            - "uv run ruff"
            - "uv run mypy"
            - "uv run pyright"
            - "ruff"
            - "mypy"
            - "pyright"
            - "black --check"
            - "uv sync"
            - "uv pip install -r"
            - "uv pip install -e"
            - ".venv/bin/pip install -r"
            - ".venv/bin/pip install -e"
            # Running the app locally and probing it. curl only to localhost / 127.0.0.1 /
            # [::1] and never writing a file (-o, -O, -T, -c, ... are refused).
            - "./init.sh"
            - "bash init.sh"
            - "sh init.sh"
            - "npm start"
            - "npx next dev"
            - "next dev"
            - "npx next start"
            - "next start"
            - "@curl:curl_localhost"
            - "ps"
            - "pgrep"
            - "ss"
            - "lsof"
            - "kill"
            - "pkill"
    # Task ownership (as owned_paths.yaml) for the security verify role: its report file
    # .shipcrew/security.md is writable too. With shipcrew_test_writes_only, the security writes test files
    # inside the task's owned paths and that report, nothing else.
    shipcrew_owned_paths:
      type: function
      on: [tool_call]
      function:
        path: omnigent.shipcrew.policies.owned_paths
        arguments:
          owned_paths: []  # @task.owned_paths
          root: ""  # @task.root
          extra_free_paths: [".shipcrew/security.md"]
          reason: Stay inside owned_paths; a human approves shared-file edits on the card.
    # Verify role: security writes test files only (test/, tests/, e2e/, __tests__/,
    # *.test.*, *.spec.*: PoC and regression tests) plus its report
    # .shipcrew/security.md. Every other write is refused; shipcrew_owned_paths still
    # asks for a test outside the task's paths. The server fills the @task.root slot.
    shipcrew_test_writes_only:
      type: function
      on: [tool_call]
      function:
        path: omnigent.shipcrew.policies.test_writes_only
        arguments:
          role: security
          extra_paths: [".shipcrew/security.md"]
          root: ""  # @task.root
          reason: A vulnerability goes into your findings with its PoC; the board creates the fix task.
# <<< shipcrew-guardrails
