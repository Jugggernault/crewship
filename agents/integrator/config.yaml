spec_version: 1
name: integrator
description: >-
  shipcrew integrator: merges origin/main into a conflicting or broken task branch, keeps both sides' behaviour, proves no conflict markers remain, CI green.

# Code-writing / tool-heavy role: the real Claude Code CLI (claude-native), so
# the human can open its terminal from the board and take over, with only its
# bundle's skills and MCP servers (no host-user plugins, hooks or settings). No model is pinned:
# it runs on the configured Claude provider (a Claude subscription works).
executor:
  type: omnigent
  config:
    harness: claude-native
    # One gate, no bypassPermissions: the guardrails below decide every shell
    # command (allowlisted -> runs with no prompt, anything else -> an ASK
    # approval card in the Inbox) and every write (owned paths). Claude's own
    # `default` mode would prompt a second time, so the tools the policies
    # govern are pre-approved with --allowedTools; any other tool still gets
    # Claude's prompt, which omnigent routes to the Inbox too.
    permission_mode: default
    allowed_tools: Bash,Edit,Write,MultiEdit,NotebookEdit,Read,Glob,Grep,LS,TodoWrite,Task,Agent,Skill,BashOutput,KillShell,WebSearch,WebFetch,mcp__omnigent
    # >>> shipcrew-mcp:
    # GENERATED from agents/_shared/mcp/*.json by scripts/build_agents.py.
    # Only these MCP servers (plus omnigent's relay), never the host user's own.
    strict_mcp_config: true
    # No host-user settings (~/.claude/settings.json: their plugins, hooks,
    # user skills); the bundle's own skills still load (--plugin-dir).
    setting_sources: project,local
    # <<< shipcrew-mcp

# ROLE.md + _shared/COMMON.md, rendered by scripts/build_agents.py.
instructions: AGENTS.md

# The session cwd is the task's git worktree (created by the shipcrew
# orchestrator). Unsandboxed like omnigent's polly workers; the policy layer
# below enforces the shipcrew limits.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

# >>> shipcrew-guardrails: blast_radius no_remote_writes no_env_read workflows_approval no_browser_download shell_allowlist_builder owned_paths
# GENERATED from agents/_shared/policies/*.yaml by scripts/build_agents.py.
guardrails:
  ask_timeout: 86400
  policies:
    # Polly's catastrophic DENY set: force-push, rm -rf of / or a system dir,
    # hard reset to a remote ref. Everything recoverable runs without an ASK
    # (headless workers cannot answer one), the push ban is shipcrew_no_remote_writes.
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.orchestration.blast_radius
        arguments:
          gate_pushes: false
    # Workers never publish: the shipcrew orchestrator pushes and runs the PR loop.
    shipcrew_no_remote_writes:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          reason: Workers may not push or open/merge PRs; the shipcrew orchestrator does that. Commit locally and finish.
          expression: |
            event.type == "tool_call"
            && event.data.name in ["sys_os_shell", "Bash", "bash", "Shell", "terminal", "developer__shell", "shell"]
            && has(event.data.arguments.command)
            && (
              event.data.arguments.command.matches(r'(^|[^A-Za-z0-9_.-])git(\s+(-C|-c|--git-dir|--work-tree|--namespace)\s+\S+|\s+-\S+)*\s+push\b')
              || event.data.arguments.command.matches(r'(^|[^A-Za-z0-9_.-])gh\s+(pr\s+(create|merge|close|reopen|ready)|release\s+create|repo\s+(create|delete|fork))\b')
              || event.data.arguments.command.matches(r'(^|[^A-Za-z0-9_.-])gh\s+api\b.*(-X|--method)(\s+|=)?(POST|PUT|PATCH|DELETE)\b')
            )
            ? {"result": "DENY"}
            : {"result": "ALLOW"}
    # Secrets stay out of the model context. .env.example / .sample / .template are fine.
    # `vercel env pull` is the one allowed command naming a .env file (it writes it).
    shipcrew_no_env_read:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          reason: Reading .env* secret files is not allowed. Refer to variables by name only.
          expression: |
            event.type == "tool_call"
            && (
              (
                event.data.name in ["Read", "Grep", "sys_os_read", "read", "grep"]
                && (
                  (has(event.data.arguments.file_path)
                    && event.data.arguments.file_path.matches(r'(^|/)\.env(\.[^/]*)?$')
                    && !event.data.arguments.file_path.matches(r'(^|/)\.env\.(example|sample|template|dist)$'))
                  || (has(event.data.arguments.path)
                    && event.data.arguments.path.matches(r'(^|/)\.env(\.[^/]*)?$')
                    && !event.data.arguments.path.matches(r'(^|/)\.env\.(example|sample|template|dist)$'))
                )
              )
              || (
                event.data.name in ["sys_os_shell", "Bash", "bash", "Shell", "terminal", "developer__shell", "shell"]
                && has(event.data.arguments.command)
                && event.data.arguments.command.matches(r'(^|[\s\x22\x27=<>/:])\.env(\.(local|development|production|test|preview|staging|prod|dev))*($|[\s\x22\x27;|&)>])')
                && !event.data.arguments.command.matches(r'^\s*(npx\s+)?vercel\s+env\s+pull\b[^;&|]*$')
              )
            )
            ? {"result": "DENY"}
            : {"result": "ALLOW"}
    # CI definitions are the merge gate: changing them needs a human (approval card
    # in the Inbox). Any write to .github/workflows/** asks: write tools, and shell
    # write targets (redirections, cp/mv/tee, sed -i, git checkout <path> ...) or a
    # command naming a workflow path that is not a known reader (yq -i, git diff
    # --output, scripts). Reads pass, also inside a chain with other commands
    # (`git checkout x -- a.js && ls .github/workflows` no longer asks); a command
    # naming workflows that cannot be analyzed ($(..), backticks, heredocs) asks.
    shipcrew_workflows_approval:
      type: function
      on: [tool_call]
      function:
        path: omnigent.shipcrew.policies.workflows_guard
        arguments:
          reason: Editing .github/workflows/** needs human approval.
    # A browser is preinstalled at $CHROMIUM_PATH; browser downloads are never needed.
    shipcrew_no_browser_download:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          reason: Never download browsers. Use the preinstalled one at $CHROMIUM_PATH (launchOptions.executablePath).
          expression: |
            event.type == "tool_call"
            && event.data.name in ["sys_os_shell", "Bash", "bash", "Shell", "terminal", "developer__shell", "shell"]
            && has(event.data.arguments.command)
            && event.data.arguments.command.matches(r'(\bplaywright(@\S+)?\s+install(-deps)?\b|@puppeteer/browsers\s+install\b|\bpuppeteer\s+browsers\s+install\b)')
            ? {"result": "DENY"}
            : {"result": "ALLOW"}
    # Builder shell allowlist (developer, designer, integrator): these commands run
    # with no prompt; any other command, or one with $(..), `..` or a heredoc,
    # pauses on an approval card (Inbox; the board card goes to Intervention).
    # Write targets are judged by shipcrew_owned_paths: dependency changes (deps)
    # pass only when the task owns package.json, `sed -i` / `perl -pi` (fs_edit)
    # only on owned files, curl only to the local app (local_http). Chains, pipes,
    # `2>&1`, `$?` and `${PIPESTATUS[0]}` are fine when every part is.
    shipcrew_shell_allowlist:
      type: function
      on: [tool_call]
      function:
        path: omnigent.shipcrew.policies.shell_allowlist
        arguments:
          role: builder
          shell_writes: true
          reason: A human approves or denies it on the approval card.
          # Commands a $VAR / ${VAR} expansion may appear in (the expansion-safe
          # entries: no !banned option, no glob word; see policies.shell_allowlist).
          read_only:
            # Read-only shell: listing, reading, searching, text processing. `!glob` words
            # refuse an argument (find -exec/-delete, sed -i or a `w` command, sort -o ...).
            - "ls"
            - "cat"
            - "head"
            - "tail"
            - "wc"
            - "rg !--pre*"  # --pre runs a preprocessor command
            - "grep"
            - "egrep"
            - "fgrep"
            - "find !-delete !-exec !-execdir !-ok !-okdir !-fprint* !-fls !-fprintf"
            # sed only with print scripts (`sed -n 5,40p f`, `sed -n '/re/p' f`): a sed
            # script can write files (w) or run commands (e), so nothing else passes.
            - 're:^sed -n (-[Er] )?(\d+(,(\d+|\$))?p|\$p|/[^/]*/(,/[^/]*/)?p)( [^ ]+)*$'
            # sed as a pipe filter (`... 2>&1 | sed 's/x/y/g'`): stdin only, no file
            # operand, no -i/-f/-s, no r/R/w/W/e commands, no w/e flags.
            - "@sed:sed_filter"
            - "jq"
            - "yq !-i* !--inplace*"
            - "tree !-o"
            - "sort !-o* !--output*"
            - "uniq"  # `uniq IN OUT` writes OUT: judged as a write
            - "cut"
            - "tr"
            - "diff"
            - "cmp"
            - "comm"
            - "column"
            - "nl"
            - "file"
            - "stat"
            - "du"
            - "df"
            - "pwd"
            - "cd"
            - "echo"
            - "printf !-v*"  # printf -v sets a shell variable
            - "which"
            - "type"
            - "basename"
            - "dirname"
            - "realpath"
            - "readlink"
            - "date"
            - "sleep"
            - "wait"  # for a job started with a trailing `&`
            - "true"
            - "false"
            - "test"
            - "["
            - "uname"
            - "whoami"
            - 're:^python3? -m json\.tool( -[-\w]+)*( \S+)?$'
            - 're:^[\w.@/-]+ (--version|-v|-V)$'
            # GitHub reads (the board never calls real GitHub; a fake gh is fine too).
            - "gh pr view"
            - "gh pr list"
            - "gh pr diff"
            - "gh pr checks"
            - "gh pr status"
            - "gh run view"
            - "gh run list"
            - "gh issue view"
            - "gh issue list"
            - "gh repo view"
            - "gh auth status"
            # xargs feeding a read-only command only
            - "xargs cat"
            - "xargs head"
            - "xargs wc"
            - "xargs grep"
            - "xargs ls"
            - "xargs rg"
            # More read-only inspection tools
            - "od"
            - "xxd"
            - "hexdump"
            - "tree"
            - "md5sum"
            - "sha256sum"
            - "awk !-i"
            - "tac"
            - "rev"
            - "paste"
            - "fold"
            - "expand"
            # git inspection. No remote writes, no config changes.
            - "git status"
            - "git diff !--output*"
            - "git log !--output*"
            - "git show !--output*"
            - "git rev-parse"
            - "git rev-list !--output*"
            - "git ls-files"
            - "git ls-tree"
            - "git cat-file"
            - "git blame"
            - "git grep !-O* !--open-files-in-pager*"
            - "git merge-base"
            - "git describe"
            - "git shortlog !--output*"
            - "git name-rev"
            - "git for-each-ref"
            - "git show-ref"
            - "git diff-tree !--output*"
            - "git check-ignore"
            - "git worktree list"
            - "git stash list"
            - "git stash show"
            - "git reflog $"
            - "git reflog show"
            - "git remote $"
            - "git remote -v $"
            - "git tag $"
            - "git tag -l"
            - "git tag --list"
            - "git branch $"
            - "git branch --show-current"
            - "git branch --list"
            - "git branch -a $"
            - "git branch -r $"
            - "git branch -v $"
            - "git branch -vv $"
            - "git branch --contains"
            - "git branch --merged"
            - "git config --get"
            - "git config --get-all"
          allow:
            # Read-only shell: listing, reading, searching, text processing. `!glob` words
            # refuse an argument (find -exec/-delete, sed -i or a `w` command, sort -o ...).
            - "ls"
            - "cat"
            - "head"
            - "tail"
            - "wc"
            - "rg !--pre*"  # --pre runs a preprocessor command
            - "grep"
            - "egrep"
            - "fgrep"
            - "find !-delete !-exec !-execdir !-ok !-okdir !-fprint* !-fls !-fprintf"
            # sed only with print scripts (`sed -n 5,40p f`, `sed -n '/re/p' f`): a sed
            # script can write files (w) or run commands (e), so nothing else passes.
            - 're:^sed -n (-[Er] )?(\d+(,(\d+|\$))?p|\$p|/[^/]*/(,/[^/]*/)?p)( [^ ]+)*$'
            # sed as a pipe filter (`... 2>&1 | sed 's/x/y/g'`): stdin only, no file
            # operand, no -i/-f/-s, no r/R/w/W/e commands, no w/e flags.
            - "@sed:sed_filter"
            - "jq"
            - "yq !-i* !--inplace*"
            - "tree !-o"
            - "sort !-o* !--output*"
            - "uniq"  # `uniq IN OUT` writes OUT: judged as a write
            - "cut"
            - "tr"
            - "diff"
            - "cmp"
            - "comm"
            - "column"
            - "nl"
            - "file"
            - "stat"
            - "du"
            - "df"
            - "pwd"
            - "cd"
            - "echo"
            - "printf !-v*"  # printf -v sets a shell variable
            - "which"
            - "type"
            - "basename"
            - "dirname"
            - "realpath"
            - "readlink"
            - "date"
            - "sleep"
            - "wait"  # for a job started with a trailing `&`
            - "true"
            - "false"
            - "test"
            - "["
            - "uname"
            - "whoami"
            - 're:^python3? -m json\.tool( -[-\w]+)*( \S+)?$'
            - 're:^[\w.@/-]+ (--version|-v|-V)$'
            # GitHub reads (the board never calls real GitHub; a fake gh is fine too).
            - "gh pr view"
            - "gh pr list"
            - "gh pr diff"
            - "gh pr checks"
            - "gh pr status"
            - "gh run view"
            - "gh run list"
            - "gh issue view"
            - "gh issue list"
            - "gh repo view"
            - "gh auth status"
            # xargs feeding a read-only command only
            - "xargs cat"
            - "xargs head"
            - "xargs wc"
            - "xargs grep"
            - "xargs ls"
            - "xargs rg"
            # More read-only inspection tools
            - "od"
            - "xxd"
            - "hexdump"
            - "tree"
            - "md5sum"
            - "sha256sum"
            - "awk !-i"
            - "tac"
            - "rev"
            - "paste"
            - "fold"
            - "expand"
            # git inspection. No remote writes, no config changes.
            - "git status"
            - "git diff !--output*"
            - "git log !--output*"
            - "git show !--output*"
            - "git rev-parse"
            - "git rev-list !--output*"
            - "git ls-files"
            - "git ls-tree"
            - "git cat-file"
            - "git blame"
            - "git grep !-O* !--open-files-in-pager*"
            - "git merge-base"
            - "git describe"
            - "git shortlog !--output*"
            - "git name-rev"
            - "git for-each-ref"
            - "git show-ref"
            - "git diff-tree !--output*"
            - "git check-ignore"
            - "git worktree list"
            - "git stash list"
            - "git stash show"
            - "git reflog $"
            - "git reflog show"
            - "git remote $"
            - "git remote -v $"
            - "git tag $"
            - "git tag -l"
            - "git tag --list"
            - "git branch $"
            - "git branch --show-current"
            - "git branch --list"
            - "git branch -a $"
            - "git branch -r $"
            - "git branch -v $"
            - "git branch -vv $"
            - "git branch --contains"
            - "git branch --merged"
            - "git config --get"
            - "git config --get-all"
            # Local git writes on the task branch. Still no push and no remote writes
            # (shipcrew_no_remote_writes DENYs them); `git fetch` only reads the remote.
            - "git add"
            - "git commit"
            - "git branch !-D !-d !--delete !-m !-M !--move !-c !-C !--copy !-f !--force !-u !--set-upstream-to* !--unset-upstream !--edit-description"
            - "git switch"
            - "git checkout"
            - "git merge"
            - "git rebase !-i !--interactive !-x !--exec*"
            - "git cherry-pick"
            - "git revert"
            - "git restore"
            - "git reset !--hard !--merge !--keep"
            - "git mv"
            - "git rm"
            - "git stash push -m"
            - "git fetch !--upload-pack*"
            # File operations; shipcrew_owned_paths decides whether each target is allowed.
            - "mkdir"
            - "touch"
            - "cp"
            - "mv"
            - "rm"
            - "rmdir"
            - "chmod"
            - "tee"
            # Package managers (install from the lockfile only), test runners, linters,
            # typecheckers and builds. Adding or removing a dependency is not here: it
            # changes package.json + the lockfile (shared contract files) and asks.
            # Output-only package-manager flags (-s/--silent, --loglevel <x>, --reporter=<x>,
            # --color/--no-color, -w outside dependency commands) are dropped before
            # matching: `pnpm -s lint` matches "pnpm lint", `npm run --silent test` "npm run *".
            - "npm test"
            - "npm t"
            - "npm run $"
            - "npm run *"
            - "npm run-script *"
            - "npm ci"
            - "npm ls"
            - "npm view"
            - "npm audit !fix"
            - "pnpm test"
            - "pnpm run *"
            - "pnpm install --frozen-lockfile"
            - "pnpm i --frozen-lockfile"
            - "pnpm lint"
            - "pnpm build"
            - "pnpm typecheck"
            - "pnpm type-check"
            - "pnpm e2e"
            - "pnpm test:*"
            - "pnpm e2e:*"
            - "npm run e2e"
            - "pnpm ls"
            - "pnpm peers check"
            - "pnpm why"
            - "pnpm outdated"
            - "pnpm list"
            - "npm why"
            - "npm explain"
            - "npm outdated"
            - "yarn why"
            - "pnpm audit !--fix"
            - "yarn test"
            - "yarn run *"
            - "yarn install --frozen-lockfile"
            - "yarn install --immutable"
            - "yarn lint"
            - "yarn build"
            - "yarn typecheck"
            - "yarn e2e"
            - "node --test"
            - "npx vitest"
            - "vitest"
            - "npx jest"
            - "jest"
            - "npx playwright test"
            - "playwright test"
            - "npx tsc"
            - "tsc"
            - "npx eslint"
            - "eslint"
            - "npx prettier"
            - "prettier"
            - "npx next build"
            - "next build"
            - "npx next lint"
            - "next lint"
            - "npx biome"
            - "biome"
            - "npx stylelint"
            - "npx @google/design.md lint"
            - "npx @google/design.md export"
            - "npx @google/design.md spec"
            - "npx @google/design.md diff"
            - "pytest"
            - "python -m pytest"
            - "python3 -m pytest"
            - ".venv/bin/pytest"
            - ".venv/bin/python -m pytest"
            - "uv run pytest"
            - "uv run python -m pytest"
            - "uv run ruff"
            - "uv run mypy"
            - "uv run pyright"
            - "ruff"
            - "mypy"
            - "pyright"
            - "black --check"
            - "uv sync"
            - "uv pip install -r"
            - "uv pip install -e"
            - ".venv/bin/pip install -r"
            - ".venv/bin/pip install -e"
            # Dependency changes (builders + scaffolder). Each one rewrites package.json and
            # the lockfile, so shipcrew_owned_paths lets it through only when the task owns
            # package.json by name (owning it owns the lockfiles next to it); otherwise it
            # asks. Never global, never another directory or workspace package.
            - "npm install !-g !--global !--prefix* !--location* !-w !--workspace* !--include-workspace-root*"
            - "npm i !-g !--global !--prefix* !--location* !-w !--workspace* !--include-workspace-root*"
            - "npm add !-g !--global !--prefix* !--location* !-w !--workspace* !--include-workspace-root*"
            - "pnpm add !-g !--global !-C !--dir* !-w !--workspace* !-r !--recursive !-F !--filter* !--prefix*"
            - "pnpm install !-g !--global !-C !--dir* !-w !--workspace* !-r !--recursive !-F !--filter* !--prefix*"
            - "pnpm i !-g !--global !-C !--dir* !-w !--workspace* !-r !--recursive !-F !--filter* !--prefix*"
            - "yarn add !--cwd* !-W !--ignore-workspace-root-check"
            # In-place text edits (builders + scaffolder): `sed -i` with ONE simple
            # substitution (no address regex, no second command, no w/e/r, no `\n` in the
            # replacement) and `perl -pi -e 's/a/b/g'` with one code-free substitution (no
            # /e, no @{..}, no $var interpolation). Any other `sed -i` / `perl -pi` is DENY
            # with a hint to use the Edit tool. The edited files are write targets for
            # shipcrew_owned_paths (and the workflows guard).
            - "@sed:sed_in_place"
            - "@perl:perl_in_place"
            # curl to the app on this machine only: localhost / 127.0.0.1 / [::1] / 0.0.0.0,
            # any port and method, headers, inline data (-d '{..}'), -w, -s, -i. Output
            # files (-o) are write targets (owned paths / test writes; /dev/null and /tmp
            # are free). Refused: any other host, -K/--config, -c/-D/--trace files, -O,
            # proxies, unix sockets, -d @file / -T file outside the worktree or on .env*.
            - "@curl:curl_localhost"
    # Task ownership: a write (Write/Edit, shell redirection, cp/mv/rm/touch/mkdir,
    # git mv/rm/restore, prettier --write, eslint --fix, a dependency change)
    # outside the task's owned_paths asks, and so does a write to package.json or a
    # lockfile unless the task owns it by name. Build output, caches and /tmp are
    # free; reads are never gated. A file another in-progress task of the mission
    # owns is refused (DENY) with a hint to work against the shared contract. The
    # shipcrew server fills the @task slots when it starts a board task (the other
    # tasks as a start-time snapshot); left empty the policy abstains.
    shipcrew_owned_paths:
      type: function
      on: [tool_call]
      function:
        path: omnigent.shipcrew.policies.owned_paths
        arguments:
          owned_paths: []  # @task.owned_paths
          root: ""  # @task.root
          other_tasks: []  # @task.other_tasks
          reason: Stay inside owned_paths; a human approves shared-file edits on the card.
# <<< shipcrew-guardrails
