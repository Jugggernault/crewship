# Reviewer shell allowlist: read-only inspection plus the project's test
# runners, so a review can re-run the suite without an approval card. No git
# writes, no installs, no redirection into files except /dev/null and /tmp.
# Anything else asks.
shipcrew_shell_allowlist:
  type: function
  on: [tool_call]
  function:
    path: omnigent.shipcrew.policies.shell_allowlist
    arguments:
      role: reviewer
      shell_writes: false
      reason: A human approves or denies it on the approval card.
      # Commands a $VAR / ${VAR} expansion may appear in (the expansion-safe
      # entries: no !banned option, no glob word; see policies.shell_allowlist).
      read_only:
        # @include allowlists/read_only
        # @include allowlists/git_read
      allow:
        # @include allowlists/read_only
        # @include allowlists/git_read
        # @include allowlists/test_runners
