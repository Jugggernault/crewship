# QA shell allowlist: read, test, run the app, curl to localhost only, plus file
# operations and `git add` / `git commit` for the tests it writes. Every write
# target is judged by shipcrew_test_writes_only (tests + .shipcrew/qa.json only)
# and shipcrew_owned_paths. Anything else asks.
shipcrew_shell_allowlist:
  type: function
  on: [tool_call]
  function:
    path: omnigent.shipcrew.policies.shell_allowlist
    arguments:
      role: qa
      shell_writes: true
      reason: A human approves or denies it on the approval card.
      # Commands a $VAR / ${VAR} expansion may appear in (the expansion-safe
      # entries: no !banned option, no glob word; see policies.shell_allowlist).
      read_only:
        # @include allowlists/read_only
        # @include allowlists/git_read
      allow:
        # @include allowlists/read_only
        # @include allowlists/git_read
        # @include allowlists/git_commit
        # @include allowlists/fs_write
        # @include allowlists/dev_tools
        # @include allowlists/run_app
