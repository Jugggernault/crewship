# Task ownership (as owned_paths.yaml) for the qa verify role: its report file
# .shipcrew/qa.json is writable too. With shipcrew_test_writes_only, the qa writes test files
# inside the task's owned paths and that report, nothing else.
shipcrew_owned_paths:
  type: function
  on: [tool_call]
  function:
    path: omnigent.shipcrew.policies.owned_paths
    arguments:
      owned_paths: []  # @task.owned_paths
      root: ""  # @task.root
      other_tasks: []  # @task.other_tasks
      extra_free_paths: [".shipcrew/qa.json"]
      reason: Stay inside owned_paths; a human approves shared-file edits on the card.
