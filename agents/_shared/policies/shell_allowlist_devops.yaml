# Devops shell allowlist: read-only shell, git reads, Vercel reads, and the ship
# stage's exact `vercel link --yes --project <name>` / `vercel deploy --prod --yes`
# plus curl to *.vercel.app. Every other vercel command (env, domains, git
# connect, remove, ...) asks. No redirection into files except /dev/null and /tmp.
shipcrew_shell_allowlist:
  type: function
  on: [tool_call]
  function:
    path: omnigent.shipcrew.policies.shell_allowlist
    arguments:
      role: devops
      shell_writes: false
      reason: A human approves or denies it on the approval card.
      # Commands a $VAR / ${VAR} expansion may appear in (the expansion-safe
      # entries: no !banned option, no glob word; see policies.shell_allowlist).
      read_only:
        # @include allowlists/read_only
        # @include allowlists/git_read
      allow:
        # @include allowlists/read_only
        # @include allowlists/git_read
        # @include allowlists/vercel_read
        # @include allowlists/vercel_deploy
