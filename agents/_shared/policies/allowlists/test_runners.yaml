# Test runners only (the reviewer re-runs the suite on the diff it reviews).
# Plus the read-only checks (typecheck, lint) and a lockfile-pinned install so a
# fresh review worktree can run them. No new deps, builds or formatters.
- "npm test"
- "npm t"
- "pnpm test"
- "yarn test"
- "npm run typecheck"
- "npm run lint"
- "pnpm typecheck"
- "pnpm run typecheck"
- "pnpm lint"
- "pnpm run lint"
- "npx tsc --noEmit"
- "npm ci"
- "pnpm install --frozen-lockfile"
- "pnpm i --frozen-lockfile"
- "node --test"
- "npx vitest run"
- "vitest run"
- "npx jest"
- "jest"
- "pytest"
- "python -m pytest"
- "python3 -m pytest"
- ".venv/bin/pytest"
- "uv run pytest"
- "pnpm -s lint"
- "pnpm --silent lint"
- "pnpm -s run lint"
- "pnpm -s typecheck"
- "pnpm --silent typecheck"
- "pnpm -s run typecheck"
- "pnpm -s test"
- "pnpm --silent test"
- "pnpm -s run test"
