# Test runners only (the reviewer re-runs the suite on the diff it reviews).
# Plus the read-only checks (typecheck, lint) and a lockfile-pinned install so a
# fresh review worktree can run them. No new deps, builds, e2e or formatters (CI
# already ran them green; the reviewer never re-runs them). `pnpm -s test`,
# `npm run --silent lint` match these plain entries (output flags are dropped).
- "npm test"
- "npm t"
- "pnpm test"
- "yarn test"
- "npm run test"
- "npm run typecheck"
- "npm run lint"
- "pnpm typecheck"
- "pnpm run typecheck"
- "pnpm lint"
- "pnpm run lint"
- "pnpm run test"
- "npx tsc --noEmit"
- "npm ci"
- "pnpm install --frozen-lockfile"
- "pnpm i --frozen-lockfile"
- "node --test"
- "npx vitest run"
- "vitest run"
- "npx jest"
- "jest"
- "pytest"
- "python -m pytest"
- "python3 -m pytest"
- ".venv/bin/pytest"
- "uv run pytest"
