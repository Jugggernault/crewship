# git inspection. No remote writes, no config changes.
- "git status"
- "git diff !--output*"
- "git log !--output*"
- "git show !--output*"
- "git rev-parse"
- "git rev-list !--output*"
- "git ls-files"
- "git ls-tree"
- "git cat-file"
- "git blame"
- "git grep !-O* !--open-files-in-pager*"
- "git merge-base"
- "git describe"
- "git shortlog !--output*"
- "git name-rev"
- "git for-each-ref"
- "git show-ref"
- "git diff-tree !--output*"
- "git check-ignore"
- "git worktree list"
- "git stash list"
- "git stash show"
- "git reflog $"
- "git reflog show"
- "git remote $"
- "git remote -v $"
- "git tag $"
- "git tag -l"
- "git tag --list"
- "git branch $"
- "git branch --show-current"
- "git branch --list"
- "git branch -a $"
- "git branch -r $"
- "git branch -v $"
- "git branch -vv $"
- "git branch --contains"
- "git branch --merged"
- "git config --get"
- "git config --get-all"
