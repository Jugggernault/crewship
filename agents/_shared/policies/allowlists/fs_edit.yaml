# In-place text edits (builders + scaffolder): `sed -i` with ONE simple
# substitution (no address regex, no second command, no w/e/r, no `\n` in the
# replacement) and `perl -pi -e 's/a/b/g'` with one code-free substitution (no
# /e, no @{..}, no $var interpolation). Any other `sed -i` / `perl -pi` is DENY
# with a hint to use the Edit tool. The edited files are write targets for
# shipcrew_owned_paths (and the workflows guard).
- "@sed:sed_in_place"
- "@perl:perl_in_place"
