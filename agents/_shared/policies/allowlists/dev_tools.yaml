# Package managers (install from the lockfile only), test runners, linters,
# typecheckers and builds. Adding or removing a dependency is not here: it
# changes package.json + the lockfile (shared contract files) and asks.
# Output-only package-manager flags (-s/--silent, --loglevel <x>, --reporter=<x>,
# --color/--no-color, -w outside dependency commands) are dropped before
# matching: `pnpm -s lint` matches "pnpm lint", `npm run --silent test` "npm run *".
- "npm test"
- "npm t"
- "npm run $"
- "npm run *"
- "npm run-script *"
- "npm ci"
