# Running the app locally (verify roles). A vetted variable may be an argument
# (`npx next start -p ${PORT:-3000}`, `pkill -f "next start -p $PORT"`). The
# curl probes are the local_http group.
- "./init.sh"
- "bash init.sh"
- "sh init.sh"
- "npm start"
- "npx next dev"
- "next dev"
- "npx next start"
- "next start"
- "ps"
- "pgrep"
- "ss"
- "lsof"
- "kill"
- "pkill"
