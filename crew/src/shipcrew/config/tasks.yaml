backlog_task:
  agent: product_manager
  description: |
    PRD:
    ---
    {prd}
    ---
    Produce the backlog. There is NO cap on the number of features: every feature, screen and
    flow the PRD asks for must be covered (dropping agreed scope is a failure). Merge tiny items,
    never drop them. Order by dependency then demo value.
    Feature F01 is always "Foundation": app shell, design tokens, shared data layer and API
    contract, shared components, a stub for every route/screen, CI green.
    Each feature gets 2-6 acceptance criteria phrased as observable behaviour a browser/e2e
    test can check ("visiting /x shows ...", "submitting ... persists and appears after reload"),
    with the PRD's exact copy and numbers.
    End with a coverage matrix: every PRD feature/section -> the feature ids covering it.
    Respect the PRD's non-goals.
  expected_output: A numbered feature list (id F01.., title, acceptance criteria) plus the coverage matrix.

architecture_task:
  agent: architect
  context: [backlog_task]
  description: |
    PRD:
    ---
    {prd}
    ---
    Given the backlog, decide:
    - platform: "web", "mobile" or "both".
    - stack (one line). Rules, unless the PRD says otherwise:
      web    -> Next.js App Router + TypeScript + Tailwind + shadcn/ui (components added through the shadcn MCP),
      mobile -> Expo (React Native) + TypeScript + NativeWind + React Native Reusables
                (components from https://reactnativereusables.com/docs/catalogs), Jest + RNTL, e2e via Expo web + Playwright.
    - needs_db: true only if the PRD provides or asks for a real database (then Neon Postgres + Drizzle).
    - data_model: ALWAYS required (entities, key fields, relations). With needs_db=false it is the
      contract of the fake database service lib/db.ts (faker-generated, seeded), which every API route uses.
    - tracks: group features into independent tracks that can be built in parallel by different
      engineers in separate branches. F01 is alone in track "foundation". Each track owns its
      routes/screens/API routes; set depends_on (feature ids) only when a track truly needs another
      track's feature merged first. Aim for 3-6 tracks.
    Keep the backlog as is unless a feature is technically impossible in a day - then split it.
  expected_output: The final backlog with platform, stack, needs_db, data_model and features (each with track and depends_on).
